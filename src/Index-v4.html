<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enffoco — Sistema de Gestão</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdHlsZT0ic3RvcC1jb2xvcjojNEE5QjZGIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMTAwJSIgc3R5bGU9InN0b3AtY29sb3I6IzdFQ0ZDRiIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0idXJsKCNnKSIvPgogIDx0ZXh0IHg9IjE2IiB5PSIyMyIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsc2VyaWYiIGZvbnQtc2l6ZT0iMjIiIGZvbnQtd2VpZ2h0PSJib2xkIiAKICAgICAgICB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgbGV0dGVyLXNwYWNpbmc9Ii0xIj5lPC90ZXh0Pgo8L3N2Zz4=">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde:       #4A9B6F;
      --verde-dark:  #357A54;
      --verde-light: #EBF7F1;
      --verde-mid:   #A8D9BF;
      --azul:        #7ECFCF;
      --azul-light:  #E8F7F7;
      --cinza:       #F5F7F6;
      --borda:       #E0E8E4;
      --texto:       #1A2E24;
      --muted:       #6B8A7A;
      --branco:      #FFFFFF;
      --danger:      #C0392B;
      --danger-light:#FDECEA;
      --warn:        #D4820A;
      --warn-light:  #FEF3E2;
      --sidebar-w:   248px;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cinza);
      color: var(--texto);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── TELA DE LOGIN ─────────────────────────────────── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F0F7F3;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Arco pontilhado decorativo inspirado na logo */
    #login-screen::before {
      content: '';
      position: absolute;
      top: -120px;
      left: -120px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle, transparent 60%, rgba(74,155,111,0.07) 60.5%, transparent 70%),
                  radial-gradient(circle, transparent 70%, rgba(74,155,111,0.05) 70.5%, transparent 80%),
                  radial-gradient(circle, transparent 80%, rgba(126,207,207,0.04) 80.5%, transparent 90%);
      pointer-events: none;
    }

    #login-screen::after {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(126,207,207,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      background: var(--branco);
      border-radius: 20px;
      padding: 24px 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 40px rgba(74,155,111,0.1);
      position: relative;
      z-index: 1;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 0px;
    }

    /* Logo SVG da Enffoco */
    .logo-svg-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .logo-text .en { color: #4A9B6F; }
    .logo-text .ff { color: #4A9B6F; }
    .logo-text .o1 { 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6CC4A1, #7ECFCF);
      border-radius: 50%;
      color: white;
      font-size: 20px;
      font-weight: 800;
      position: relative;
      top: 1px;
    }
    .logo-text .o1::after {
      content: '+';
      font-size: 14px;
      font-weight: 700;
    }
    .logo-text .c { color: #4A9B6F; }
    .logo-text .o2 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #7ECFCF, #6CC4A1);
      border-radius: 50%;
      color: white;
      font-size: 20px;
      font-weight: 800;
      position: relative;
      top: 1px;
    }
    .logo-text .o2::after {
      content: '+';
      font-size: 14px;
      font-weight: 700;
    }

    .login-logo p {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 8px;
    }

    .form-group { margin-bottom: 13px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--borda);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--texto);
      background: var(--cinza);
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: var(--verde);
      background: var(--branco);
      box-shadow: 0 0 0 3px rgba(74,155,111,0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--verde), #5BAD80);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-login:hover { background: linear-gradient(135deg, var(--verde-dark), var(--verde)); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,155,111,0.3); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .login-erro {
      background: var(--danger-light);
      color: var(--danger);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }

    .login-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #B0C4BA;
      font-weight: 500;
    }

    /* ── APP ───────────────────────────────────────────── */
    #app { display: none; min-height: 100vh; }

    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--texto);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 1px;
    }
    .sidebar-logo-text .en,
    .sidebar-logo-text .ff,
    .sidebar-logo-text .c  { color: var(--verde-mid); }
    .sidebar-logo-text .o1s,
    .sidebar-logo-text .o2s {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #6CC4A1, #7ECFCF);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      color: white;
      position: relative;
      top: 0px;
    }
    .sidebar-logo-text .o1s::after,
    .sidebar-logo-text .o2s::after { content: '+'; font-size: 9px; }

    .sidebar-logo p { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 5px; font-weight: 500; }

    .sidebar-user {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--verde), #6CC4A1);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .user-info .user-name { font-size: 13px; font-weight: 600; color: white; }
    .user-info .user-role { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 1px; }

    .sidebar-nav { flex: 1; padding: 12px 12px; overflow-y: auto; }

    .nav-section {
      padding: 10px 8px 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      border-radius: 8px;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
    .nav-item.active { background: rgba(74,155,111,0.2); color: var(--verde-mid); }
    .nav-item .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.08); }
    .btn-logout {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

    .main-content { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      background: var(--branco);
      border-bottom: 1px solid var(--borda);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--texto); letter-spacing: -0.3px; font-family: var(--font-display); }
    .btn-menu-mobile { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--texto); }
    .page-content { padding: 28px; flex: 1; }

    /* CARDS */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 16px; margin-bottom: 24px; }
    .summary-card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 20px;
    }
    .summary-card .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }
    .summary-card .value { font-size: 28px; font-weight: 800; color: var(--verde); letter-spacing: -0.5px; }
    .summary-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* NAVEGACAO AGENDA */
    .agenda-nav { display: flex; align-items: center; justify-content: space-between; background: var(--branco); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .agenda-nav .periodo { font-size: 14px; font-weight: 600; color: var(--texto); }
    .agenda-nav-btns { display: flex; gap: 8px; }
    .btn-nav { padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid var(--borda); background: var(--cinza); color: var(--texto); transition: all 0.15s; }
    .btn-nav:hover { background: var(--verde); color: white; border-color: var(--verde); }
    .btn-nav-hoje { background: var(--verde); color: white; border-color: var(--verde); }
    .btn-nav-hoje:hover { background: var(--verde-dark); }

    /* SECAO */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-size: 16px; font-weight: 700; color: var(--texto); letter-spacing: -0.2px; font-family: var(--font-display); }

    /* BOTOES */
    .btn { padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--verde); color: white; }
    .btn-primary:hover { background: var(--verde-dark); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(74,155,111,0.25); }
    .btn-secondary { background: var(--cinza); color: var(--texto); border: 1px solid var(--borda); }
    .btn-secondary:hover { background: var(--borda); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* TABELA */
    .table-card { background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th { background: var(--cinza); padding: 10px 16px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--borda); }
    table td { padding: 13px 16px; border-bottom: 1px solid var(--borda); font-size: 13px; }
    table tr:last-child td { border-bottom: none; }
    table tr:hover td { background: #FAFCFB; }

    /* BADGES */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-verde  { background: var(--verde-light); color: var(--verde); }
    .badge-azul   { background: var(--azul-light); color: #2A8A8A; }
    .badge-warn   { background: var(--warn-light); color: var(--warn); }
    .badge-danger { background: var(--danger-light); color: var(--danger); }
    .badge-cinza  { background: var(--borda); color: var(--muted); }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,46,36,0.5); z-index: 200; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--branco); border-radius: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-header { padding: 22px 26px; border-bottom: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; font-family: var(--font-display); }
    .modal-close { background: var(--cinza); border: none; width: 30px; height: 30px; border-radius: 8px; font-size: 16px; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .modal-close:hover { background: var(--borda); color: var(--texto); }
    .modal-body { padding: 22px 26px; }
    .modal-footer { padding: 16px 26px; border-top: 1px solid var(--borda); display: flex; gap: 10px; justify-content: flex-end; }

    /* FORM */
    .field-group { margin-bottom: 14px; }
    .field-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 5px; }
    .field-group input,
    .field-group select,
    .field-group textarea { width: 100%; padding: 10px 13px; border: 1.5px solid var(--borda); border-radius: 9px; font-size: 13px; font-family: inherit; color: var(--texto); background: var(--cinza); outline: none; transition: all 0.2s; }
    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus { border-color: var(--verde); background: var(--branco); box-shadow: 0 0 0 3px rgba(74,155,111,0.08); }
    .field-group textarea { resize: vertical; min-height: 80px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* DIAS SEMANA */
    .dias-semana { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .dia-btn { padding: 7px 13px; border: 1.5px solid var(--borda); border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; background: var(--cinza); color: var(--muted); transition: all 0.15s; user-select: none; }
    .dia-btn.selecionado { background: var(--verde); color: white; border-color: var(--verde); }

    /* AUTOCOMPLETE */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--branco); border: 1.5px solid var(--verde); border-top: none; border-radius: 0 0 9px 9px; z-index: 50; max-height: 160px; overflow-y: auto; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .autocomplete-list.show { display: block; }
    .autocomplete-item { padding: 9px 13px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--borda); }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--verde-light); color: var(--verde); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--texto); color: white; padding: 13px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 999; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); max-width: 320px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.sucesso { background: var(--verde); }
    .toast.erro { background: var(--danger); }

    /* ESTADOS */
    .empty-state { text-align: center; padding: 52px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 14px; opacity: 0.6; }
    .empty-state p { font-size: 14px; font-weight: 500; }
    .loading { text-align: center; padding: 36px; color: var(--muted); font-size: 13px; font-weight: 500; }
    .alert-pendentes { background: var(--warn-light); border: 1px solid #F5CBA7; border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--warn); font-weight: 500; }
    .error-state { background: var(--danger-light); border: 1px solid #F1948A; border-radius: 12px; padding: 24px; text-align: center; color: var(--danger); }

    /* MOBILE */
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);}
      .sidebar.open{transform:translateX(0);}
      .main-content{margin-left:0;}
      .btn-menu-mobile{display:block;}
      .summary-grid{grid-template-columns:1fr 1fr;}
      .grid-2{grid-template-columns:1fr;}
      .page-content{padding:16px;}
    }
    @media(max-width:400px){.summary-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <!-- Logo com circulos decorativos -->
      <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:0px;padding:8px 0 0px;">
        <!-- Círculo verde grande translúcido -->
        <div style="position:absolute;top:50%;left:15%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(74,155,111,0.12) 0%,rgba(74,155,111,0) 70%);pointer-events:none;"></div>

<script>
var sessao = { usuario: null, perfil: null };
var _semanaOffset = 0;

function fazerLogin() {
  var u=document.getElementById('login-usuario').value.trim();
  var s=document.getElementById('login-senha').value.trim();
  var btn=document.getElementById('btn-entrar');
  var erro=document.getElementById('login-erro');
  if(!u||!s){mostrarErro(erro,'Preencha o usuário e a senha.');return;}
  btn.disabled=true;btn.textContent='Entrando...';erro.style.display='none';
  google.script.run
    .withSuccessHandler(function(r){
      btn.disabled=false;btn.textContent='Entrar';
      if(r.sucesso){sessao.usuario=r.nome;sessao.perfil=r.perfil;iniciarApp();}
      else mostrarErro(erro,r.mensagem);
    })
    .withFailureHandler(function(){
      btn.disabled=false;btn.textContent='Entrar';
      mostrarErro(erro,'Erro ao conectar. Tente novamente.');
    })
    .autenticar(u,s);
}
function mostrarErro(el,msg){el.textContent=msg;el.style.display='block';}
document.getElementById('login-senha').addEventListener('keydown',function(e){if(e.key==='Enter')fazerLogin();});

function iniciarApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-name').textContent=sessao.usuario;
  document.getElementById('user-role').textContent=sessao.perfil;
  document.getElementById('user-avatar').textContent=sessao.usuario.charAt(0).toUpperCase();
  var hoje=new Date();
  document.getElementById('topbar-data').textContent=hoje.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  montarMenu();_semanaOffset=0;navegarPara('agenda');
}

function montarMenu(){
  var nav=document.getElementById('sidebar-nav');
  var itens=[];
  itens.push({secao:'Principal'});
  itens.push({id:'agenda',icone:'📅',label:'Agenda'});
  if(sessao.perfil==='Gestora'){
    itens.push({secao:'Gestão'});
    itens.push({id:'clientes',icone:'👥',label:'Clientes'});
    itens.push({id:'pagamentos',icone:'💰',label:'Pagamentos'});
    itens.push({secao:'Configurações'});
    itens.push({id:'socias',icone:'👩‍⚕️',label:'Sócias'});
    itens.push({id:'usuarios',icone:'🔐',label:'Usuários'});
  }
  nav.innerHTML=itens.map(function(i){
    if(i.secao)return '<div class="nav-section">'+i.secao+'</div>';
    return '<div class="nav-item" id="nav-'+i.id+'" onclick="navegarPara(\''+i.id+'\')"><span class="icon">'+i.icone+'</span>'+i.label+'</div>';
  }).join('');
}

function navegarPara(p){
  document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');});
  var n=document.getElementById('nav-'+p);if(n)n.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  switch(p){
    case 'agenda':renderAgenda();break;
    case 'clientes':renderClientes();break;
    case 'pagamentos':renderPagamentos();break;
    case 'socias':renderSocias();break;
    case 'usuarios':renderUsuarios();break;
  }
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function fazerLogout(){
  sessao={usuario:null,perfil:null};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-usuario').value='';
  document.getElementById('login-senha').value='';
}

function mostrarToast(msg,tipo){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(tipo||'sucesso')+' show';
  setTimeout(function(){t.className='toast';},3500);
}

function formatarMoeda(v){return 'R$ '+parseFloat(v||0).toFixed(2).replace('.',',');}

function getSemana(offset){
  var hoje=new Date();
  var ini=new Date(hoje);
  ini.setDate(hoje.getDate()-hoje.getDay()+1+(offset*7));
  var fim=new Date(ini);fim.setDate(ini.getDate()+6);
  return {ini:ini,fim:fim};
}

function formatarPeriodo(ini,fim){
  var m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  if(ini.getMonth()===fim.getMonth())
    return ini.getDate()+' a '+fim.getDate()+' de '+m[ini.getMonth()]+' de '+ini.getFullYear();
  return ini.getDate()+' '+m[ini.getMonth()]+' a '+fim.getDate()+' '+m[fim.getMonth()]+' de '+fim.getFullYear();
}

function renderAgenda(){
  document.getElementById('topbar-title').textContent='Agenda';
  var c=document.getElementById('page-content');
  c.innerHTML='<div class="loading">Carregando agenda...</div>';
  google.script.run
    .withSuccessHandler(function(ats){
      var sem=getSemana(_semanaOffset);
      var aguardando=ats.filter(function(a){return a.status==='Aguardando Disponibilidade';});
      var semana=ats.filter(function(a){
        if(!a.dataAtendimento)return false;
        var p=a.dataAtendimento.toString().split('/');
        if(p.length!==3)return false;
        var d=new Date(p[2],p[1]-1,p[0]);
        return d>=sem.ini&&d<=sem.fim;
      });
      if(sessao.perfil==='Socia')semana=semana.filter(function(a){return a.sociaNome===sessao.usuario;});
      semana.sort(function(a,b){
        var pa=a.dataAtendimento.toString().split('/');
        var pb=b.dataAtendimento.toString().split('/');
        return new Date(pa[2],pa[1]-1,pa[0])-new Date(pb[2],pb[1]-1,pb[0]);
      });
      var html='';
      if(aguardando.length>0)html+='<div class="alert-pendentes">⏳ '+aguardando.length+' atendimento(s) aguardando disponibilidade da Renata.</div>';
      html+='<div class="summary-grid">';
      html+='<div class="summary-card"><div class="label">Esta semana</div><div class="value">'+semana.filter(function(a){return a.status==='Agendado';}).length+'</div><div class="sub">Agendados</div></div>';
      html+='<div class="summary-card"><div class="label">Aguardando</div><div class="value" style="color:var(--warn)">'+aguardando.length+'</div><div class="sub">Disponibilidade da Renata</div></div>';
      html+='</div>';
      html+='<div class="agenda-nav"><div class="agenda-nav-btns"><button class="btn-nav" onclick="mudarSemana(-1)">&#8592; Anterior</button><button class="btn-nav btn-nav-hoje" onclick="irParaHoje()">Hoje</button><button class="btn-nav" onclick="mudarSemana(1)">Próxima &#8594;</button></div><div class="periodo">'+formatarPeriodo(sem.ini,sem.fim)+'</div></div>';
      if(sessao.perfil==='Gestora'){
        html+='<div class="section-header"><div class="section-title">Atendimentos da Semana</div><button class="btn btn-primary" onclick="abrirModalAtendimento()">+ Novo Atendimento</button></div>';
      } else {
        html+='<div class="section-header"><div class="section-title">Minha Agenda</div></div>';
      }
      html+='<div class="table-card"><div class="table-responsive"><table>';
      html+='<tr><th>Data</th><th>Cliente</th><th>Procedimento</th><th>Sócia</th><th>Status</th></tr>';
      if(semana.length===0){
        html+='<tr><td colspan="5"><div class="empty-state"><div class="icon">📅</div><p>Nenhum atendimento nesta semana.</p></div></td></tr>';
      } else {
        semana.forEach(function(a){
          var bc=a.status==='Realizado'?'badge-verde':a.status==='Cancelado'?'badge-danger':a.status==='Aguardando Disponibilidade'?'badge-warn':'badge-cinza';
          html+='<tr><td>'+a.dataAtendimento+'</td><td><strong>'+a.clienteNome+'</strong></td><td>'+a.procedimento+'</td><td>'+a.sociaNome+'</td><td><span class="badge '+bc+'">'+a.status+'</span></td></tr>';
        });
      }
      html+='</table></div></div>';
      c.innerHTML=html;
    })
    .withFailureHandler(function(){
      c.innerHTML='<div class="error-state"><p>Erro ao carregar agenda. <a href="#" onclick="renderAgenda();return false;">Tentar novamente</a></p></div>';
    })
    .listarAtendimentos();
}

function abrirModal(html){
  var o=document.createElement('div');
  o.className='modal-overlay show';o.id='modal-overlay';
  o.innerHTML='<div class="modal">'+html+'</div>';
  o.addEventListener('click',function(e){if(e.target===o)fecharModal();});
  document.body.appendChild(o);
}
function fecharModal(){var o=document.getElementById('modal-overlay');if(o)o.remove();}

function aplicarMascaraTelefone(input){
  input.addEventListener('input',function(){
    var v=this.value.replace(/\D/g,'');
    v=v.replace(/^(\d{2})(\d)/,'($1) $2');
    v=v.replace(/(\d{5})(\d)/,'$1-$2');
    this.value=v;
  });
}
function aplicarCapitalize(input){
  input.setAttribute('autocapitalize','words');
  input.addEventListener('blur',function(){
    this.value=this.value.replace(/\b\w/g,function(l){return l.toUpperCase();});
  });
}

function converterDataParaInput(data){
  if(!data)return '';
  var p=data.toString().split('/');
  if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];
  return '';
}
function converterDataParaBR(data){
  if(!data)return '';
  var p=data.toString().split('-');
  if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];
  return data;
}

        var perfBadge=u.perfil==='Gestora'?'badge-azul':'badge-cinza';
        var statBadge=u.status==='Ativo'?'badge-verde':'badge-danger';
        var btnStatus='';if(u.status==="Ativo"){btnStatus='<button class="btn btn-sm" style="background:var(--danger-light);color:var(--danger)" data-idx="'+i+'" data-ns="Inativo" onclick="mudaStatus(this)">Desativar</button>';}else{btnStatus='<button class="btn btn-sm" style="background:var(--verde-light);color:var(--verde)" data-idx="'+i+'" data-ns="Ativo" onclick="mudaStatus(this)">Ativar</button>';}
        rows+='<tr>'
          +'<td><strong>'+u.nome+'</strong></td>'
          +'<td><span class="badge '+perfBadge+'">'+u.perfil+'</span></td>'
          +'<td><span class="badge '+statBadge+'">'+u.status+'</span></td>'
          +'<td style="display:flex;gap:8px">'
          +'<button class="btn btn-secondary btn-sm" data-idx="'+i+'" onclick="abreModalSenha(this)">Alterar Senha</button>'
          +btnStatus
          +'</td></tr>';
      }
      var html='<div class="section-header"><div class="section-title">Usuarios do Sistema</div></div>'
        +'<div class="table-card"><div class="table-responsive"><table>'
        +'<tr><th>Nome</th><th>Perfil</th><th>Status</th><th>Acoes</th></tr>'
        +rows
        +'</table></div></div>';
      c.innerHTML=html;
    })
    .withFailureHandler(function(){
      c.innerHTML='<div class="error-state"><p>Erro ao carregar. <a href="#" onclick="renderUsuarios();return false;">Tentar novamente</a></p></div>';
    })
    .listarUsuarios();
}

function abreModalSenha(btn){
  var idx=parseInt(btn.getAttribute('data-idx'));
  var u=window._usuarios[idx];
  var html='<div class="modal-header"><div class="modal-title">Alterar Senha</div><button class="modal-close" onclick="fecharModal()">&#215;</button></div>'
    +'<div class="modal-body">'
    +'<p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Alterando senha de: <strong>'+u.nome+'</strong></p>'
    +'<div class="field-group"><label>Nova Senha *</label><input type="password" id="f-nova-senha" placeholder="Minimo 6 caracteres"></div>'
    +'<div class="field-group"><label>Confirmar Senha *</label><input type="password" id="f-conf-senha" placeholder="Repita a senha"></div>'
    +'</div>'
    +'<div class="modal-footer"><button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvaSenha()">Salvar</button></div>';
  abrirModal(html);
  window._senhaUserId=u.id;
}

function salvaSenha(){
  var nova=document.getElementById('f-nova-senha').value.trim();
  var conf=document.getElementById('f-conf-senha').value.trim();
  if(!nova){mostrarToast('Digite a nova senha.','erro');return;}
  if(nova.length<6){mostrarToast('Minimo 6 caracteres.','erro');return;}
  if(nova!==conf){mostrarToast('As senhas nao conferem.','erro');return;}
  google.script.run
    .withSuccessHandler(function(r){
      if(r.sucesso){fecharModal();mostrarToast(r.mensagem,'sucesso');renderUsuarios();}
      else mostrarToast(r.mensagem,'erro');
    })
    .withFailureHandler(function(){mostrarToast('Erro ao salvar.','erro');})
    .alterarSenhaUsuario(window._senhaUserId,nova);
}

function mudaStatus(btn){
  var idx=parseInt(btn.getAttribute('data-idx'));
  var ns=btn.getAttribute('data-ns');
  var u=window._usuarios[idx];
  var msg=ns==='Inativo'?'Desativar acesso de '+u.nome+'?':'Reativar acesso de '+u.nome+'?';
  if(!confirm(msg))return;
  google.script.run
    .withSuccessHandler(function(r){
      if(r.sucesso){mostrarToast(r.mensagem,'sucesso');renderUsuarios();}
      else mostrarToast(r.mensagem,'erro');
    })
    .withFailureHandler(function(){mostrarToast('Erro. Tente novamente.','erro');})
    .alterarStatusUsuario(u.id,ns);
}
</script>
</body>
</html>
